:root {

let onglet = "toutes", tri = "date", detailId = null, montrerRefusees = false;

// Options de filtres derivees des annonces presentes
const ORDRE_TYPES = ["Studio", "1 1/2", "2 1/2", "3 1/2", "4 1/2", "5 1/2", "6 1/2", "7 1/2"];
const types = ORDRE_TYPES.filter(t => ANNONCES.some(a => a.type === t))
  .concat([...new Set(ANNONCES.map(a => a.type).filter(t => t && ORDRE_TYPES.indexOf(t) < 0))].sort());
$("f-type").innerHTML = '<option value="">Tous</option>' + types.map(t => '<option value="' + esc(t) + '">' + esc(t) + "</option>").join("");
const sites = [...new Map(ANNONCES.filter(a => a.site).map(a => [a.site, a.siteLabel || a.site])).entries()]
  .sort((x, y) => x[1].localeCompare(y[1]));
$("f-site").innerHTML = '<option value="">Tous</option>' + sites.map(s => '<option value="' + esc(s[0]) + '">' + esc(s[1]) + "</option>").join("");

function correspond(a) {
  const s = statuts[a.id] || "";
  const q = norm($("recherche").value.trim());
  if (q && !norm(a.titre).includes(q)) return false;
  if ($("f-type").value && a.type !== $("f-type").value) return false;
  if ($("f-site").value && a.site !== $("f-site").value) return false;
  const min = parseFloat($("f-prix-min").value) || 0;
  const max = parseFloat($("f-prix-max").value) || Infinity;
  if (a.prix != null && (a.prix < min || a.prix > max)) return false;
  const dmax = parseFloat($("f-distance").value);
  if (!isNaN(dmax) && (a.distance == null || a.distance > dmax)) return false;
  if (onglet === "deals" && !a.deal) return false;
  if (onglet === "favoris" && s !== "favori") return false;
  if (onglet === "contactes" && s !== "contacte") return false;
  if (onglet === "toutes" && s === "pas_interesse" && !montrerRefusees) return false;
  return true;
}

const heure = d => String(d || "").slice(11, 16);
const jour = d => String(d || "").slice(8, 10) + "/" + String(d || "").slice(5, 7);

function carteHTML(a) {
  const s = statuts[a.id] || "";
  const prix = a.prix != null ? a.prix + " $" : "—";
  const suffixe = a.prix != null ? "/ mois" : "prix non indiqué";
  const pied = [a.distance != null ? a.distance.toFixed(1) + " km du centre" : "", heure(a.date)].filter(Boolean).join("  ·  ");
  return '<div class="carte" data-id="' + esc(a.id) + '">' +
    '<div class="zone-image">' +
      (a.img ? '<img src="' + esc(a.img) + '" loading="lazy" alt="" onerror="this.remove()">' : SVG.maison) +
      (a.deal ? '<div class="ruban">Bonne affaire</div>' : "") +
      '<button class="btn-statut ' + s + '" type="button" data-cycle="1" aria-label="Statut">' + ICONE[s] + "</button>" +
    "</div>" +
    '<div class="corps">' +
      '<div class="prix"><b>' + esc(prix) + "</b><span>" + esc(suffixe) + "</span></div>" +
      '<div class="etiquettes">' + (a.type ? '<span class="tag type">' + esc(a.type) + "</span>" : "") +
        '<span class="tag">' + esc(a.siteLabel || a.site) + "</span></div>" +
      '<div class="titre-carte">' + esc(a.titre) + "</div>" +
      '<div class="pied">' + esc(pied) + "</div>" +
    "</div></div>";
}

function rendreNav() {
  const nb = v => ANNONCES.filter(a => (statuts[a.id] || "") === v).length;
  const nbFiltres = ["f-type", "f-site", "f-prix-min", "f-prix-max", "f-distance"].filter(id => $(id).value).length;
  const items = [
    ["toutes", "Toutes", SVG.toutes, 0],
    ["deals", "Deals", SVG.deals, ANNONCES.filter(a => a.deal).length],
    ["favoris", "Favoris", SVG.favoris, nb("favori")],
    ["contactes", "Contactées", SVG.contactes, nb("contacte")],
    ["filtres", "Filtres", SVG.filtres, nbFiltres]
  ];
  const ouvert = !$("voile-filtres").hidden;
  $("nav").innerHTML = items.map(i => {
    const actif = i[0] === "filtres" ? ouvert : (onglet === i[0] && !ouvert);
    return '<button type="button" data-onglet="' + i[0] + '" class="' + (actif ? "actif" : "") + '">' +
      i[2] + '<span class="label">' + i[1] + "</span>" +
      '<span class="badge"' + (i[3] ? "" : " hidden") + ">" + i[3] + "</span></button>";
  }).join("");
}

function rendre() {
  const visibles = ANNONCES.filter(correspond).sort((a, b) => tri === "prix"
    ? (a.prix == null ? Infinity : a.prix) - (b.prix == null ? Infinity : b.prix)
    : String(b.date).localeCompare(String(a.date)));
  $("grille").innerHTML = visibles.map(carteHTML).join("");
  $("titre-onglet").textContent = TITRES[onglet];
  $("compte").textContent = visibles.length + (visibles.length === 1 ? " annonce" : " annonces");
  $("vide").hidden = visibles.length > 0;
  $("f-voir").textContent = "Voir " + visibles.length + (visibles.length === 1 ? " annonce" : " annonces");
  $("effacer").hidden = !$("recherche").value;
  rendreNav();
}

function ouvrirDetail(id) {
  const a = ANNONCES.find(x => x.id === id);
  if (!a) return;
  detailId = id;
  const img = $("detail-image");
  if (a.img) { img.src = a.img; img.hidden = false; } else { img.removeAttribute("src"); img.hidden = true; }
  $("detail-deal").style.display = a.deal ? "" : "none";
  $("detail-prix").textContent = a.prix != null ? a.prix + " $" : "—";
  $("detail-prix-suffixe").textContent = a.prix != null ? "/ mois" : "prix non indiqué";
  $("detail-titre").textContent = a.titre || "";
  $("detail-type").textContent = a.type || "Non précisé";
  $("detail-site").textContent = a.siteLabel || a.site || "—";
  $("detail-distance").textContent = a.distance != null ? a.distance.toFixed(1) + " km" : "—";
  $("detail-date").textContent = jour(a.date) + " " + heure(a.date);
  $("detail-lien").href = a.url;
  const d = $("detail-doublon");
  if (a.doublon) { d.hidden = false; d.href = a.doublon.url; d.textContent = a.doublon.label; }
  else { d.hidden = true; }
  majStatutsDetail();
  $("voile-detail").hidden = false;
}

function majStatutsDetail() {
  const s = statuts[detailId] || "";
  $("detail-statuts").querySelectorAll("button").forEach(b => b.classList.toggle("actif", b.dataset.statut === s));
}

document.addEventListener("click", e => {
  const cycle = e.target.closest("[data-cycle]");
  if (cycle) {
    e.stopPropagation();
    const id = cycle.closest(".carte").dataset.id;
    const suivant = CYCLE[(CYCLE.indexOf(statuts[id] || "") + 1) % CYCLE.length];
    if (suivant) statuts[id] = suivant; else delete statuts[id];
    sauver(); rendre();
    return;
  }
  const carte = e.target.closest(".carte");
  if (carte) { ouvrirDetail(carte.dataset.id); return; }

  const statutBtn = e.target.closest("[data-statut]");
  if (statutBtn) {
    const v = statutBtn.dataset.statut;
    if ((statuts[detailId] || "") === v) delete statuts[detailId]; else statuts[detailId] = v;
    sauver(); majStatutsDetail(); rendre();
    return;
  }

  const onglBtn = e.target.closest("[data-onglet]");
  if (onglBtn) {
    if (onglBtn.dataset.onglet === "filtres") { $("voile-filtres").hidden = false; }
    else { onglet = onglBtn.dataset.onglet; $("voile-filtres").hidden = true; window.scrollTo(0, 0); }
    rendre();
    return;
  }

  const fermer = e.target.closest("[data-fermer]");
  if (fermer) { $("voile-" + fermer.dataset.fermer).hidden = true; rendre(); return; }
  if (e.target.classList.contains("voile")) { e.target.hidden = true; rendre(); }
});

$("btn-tri").addEventListener("click", () => {
  tri = tri === "prix" ? "date" : "prix";
  $("tri-label").textContent = tri === "prix" ? "Prix" : "Récent";
  rendre();
});
$("effacer").addEventListener("click", () => { $("recherche").value = ""; rendre(); });
["recherche", "f-type", "f-site", "f-prix-min", "f-prix-max", "f-distance"].forEach(id =>
  $(id).addEventListener("input", rendre));
$("f-ignorees").addEventListener("click", e => {
  montrerRefusees = !montrerRefusees;
  e.currentTarget.classList.toggle("actif", montrerRefusees);
  e.currentTarget.textContent = montrerRefusees ? "✓ Annonces refusées visibles" : "Afficher les annonces refusées";
  rendre();
});
function reinitialiser() {
  ["recherche", "f-type", "f-site", "f-prix-min", "f-prix-max", "f-distance"].forEach(id => { $(id).value = ""; });
  onglet = "toutes";
  $("voile-filtres").hidden = true;
  rendre();
}
$("f-reset").addEventListener("click", reinitialiser);
$("vide-reset").addEventListener("click", reinitialiser);
$("f-voir").addEventListener("click", () => { $("voile-filtres").hidden = true; rendre(); });

$("sous-titre").textContent = "Mise à jour " + String(DERNIERE_MAJ_ISO).slice(0, 10) + " " +
  heure(DERNIERE_MAJ_ISO) + " · " + ANNONCES.length + " annonces";
if ((Date.now() - new Date(DERNIERE_MAJ_ISO).getTime()) / 60000 > FREQUENCE_MINUTES * 3) $("banniere").hidden = false;

rendre();
</script>
</body>
</html>
